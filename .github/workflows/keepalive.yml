name: keepalive

# Runs on GitHub's machines, so it keeps your 5-hour usage windows rolling
# whether or not your own computer is on, awake, or online.
#
# Setup (once):
#   1. Repository -> Settings -> Secrets and variables -> Actions -> New secret
#        CLAUDE_CODE_OAUTH_TOKEN   the output of `claude setup-token`
#        CODEX_AUTH_JSON           the contents of ~/.codex/auth.json  (optional)
#   2. Edit cloud.env to choose the interval and which providers are enabled.
#
# GitHub's scheduler is best-effort: a run can be a few minutes to half an hour
# late, so treat window boundaries as approximate.

on:
  schedule:
    # Twice an hour. A run that is not due exits in a few seconds and makes no
    # API call at all, so the only real work happens ~5 times a day.
    #
    # Why poll instead of scheduling the ping itself every 301 minutes: cron
    # cannot express "every 301 minutes", and 301 does not divide a 24-hour
    # day, so the ping time drifts forward a little every cycle. The script
    # tracks the real due time; this schedule just has to wake it up often
    # enough to notice. Halve it to '*/15 * * * *' for tighter boundaries, or
    # raise it to '0 * * * *' for fewer runs and up to an hour of slack.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ping now, ignoring the interval'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: no-5-hour-limit
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        # Pinned to a commit, not a tag: a tag can be moved to point at
        # different code, and this job holds a token for the user's subscription.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Shallow: most runs do nothing, and this repo's history grows by a
          # commit per ping. The save step deepens it only if a push is
          # rejected and it actually has to rebase.
          fetch-depth: 1

      - name: Is a ping due?
        id: due
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail

          # One source of truth for "which providers are on": ask the script.
          # Grepping the config here would be a second, subtly different parser
          # - it would miss CLAUDE_ENABLED="true" and read a missing key as off
          # when the script defaults it to on.
          enabled="$(bash bin/keepalive.sh --config cloud.env --enabled)" || {
            echo "::error::Could not read cloud.env"; exit 1; }
          echo "Enabled providers: ${enabled:-none}"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced by workflow_dispatch."
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          out="$(L5H_STATE_FILE=state/cloud-state.env bash bin/keepalive.sh --config cloud.env --due)"
          rc=$?
          set -e

          # 0 = something is owed, 3 = nothing owed. Anything else is a broken
          # script or config, and must fail the run rather than quietly look
          # like "nothing to do" - that is how a keepalive dies unnoticed.
          case "$rc" in
            0) echo "Due: $out"; echo "due=true"  >> "$GITHUB_OUTPUT" ;;
            3) echo "$out";      echo "due=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::keepalive.sh --due failed with exit $rc: $out"; exit 1 ;;
          esac

      - name: Set up Node
        if: success() && steps.due.outputs.due == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the CLIs that are enabled
        if: success() && steps.due.outputs.due == 'true'
        env:
          ENABLED: ${{ steps.due.outputs.enabled }}
        run: |
          set -euo pipefail
          case " $ENABLED " in *" claude "*) npm install -g @anthropic-ai/claude-code ;; esac
          case " $ENABLED " in *" codex "*)  npm install -g @openai/codex ;; esac

      - name: Restore Codex credentials
        if: success() && steps.due.outputs.due == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          ENABLED: ${{ steps.due.outputs.enabled }}
        run: |
          set -euo pipefail
          case " $ENABLED " in
            *" codex "*) ;;
            *) echo "Codex disabled in cloud.env - skipping."; exit 0 ;;
          esac
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "::warning::CODEX_ENABLED is true but the CODEX_AUTH_JSON secret is empty."
            exit 0
          fi
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

      - name: Ping
        if: success() && steps.due.outputs.due == 'true'
        id: ping
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE: ${{ inputs.force }}
          ENABLED: ${{ steps.due.outputs.enabled }}
        run: |
          set -uo pipefail
          case " $ENABLED " in
            *" claude "*)
              if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
                echo "::error::CLAUDE_ENABLED is true but the CLAUDE_CODE_OAUTH_TOKEN secret is missing."
                echo "Create it on any machine with: claude setup-token"
                exit 1
              fi
              ;;
          esac

          args=(--config cloud.env)
          if [ "${FORCE:-false}" = "true" ]; then
            args+=(--force)
          fi

          # GitHub runs step shells with -e, so capture the exit code instead
          # of letting a failed ping abort before the summary is written.
          set +e
          L5H_STATE_FILE=state/cloud-state.env bash bin/keepalive.sh "${args[@]}"
          rc=$?
          set -e

          {
            echo "### No 5-Hour Limit"
            echo ''
            echo '```'
            L5H_STATE_FILE=state/cloud-state.env bash bin/keepalive.sh --config cloud.env --status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $rc

      - name: Save the new state
        # Runs even when the ping failed, so a partial success is not lost.
        if: always() && steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- state/cloud-state.env; then
            echo "State unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/cloud-state.env
          git commit -m 'chore: record keepalive ping [skip ci]'

          branch="${GITHUB_REF_NAME:-main}"

          # Another run may have landed while this one was pinging. Rebasing
          # needs real history, so unshallow before the first retry. Both sides
          # only ever move the timestamp forward, so on a conflict in this one
          # file our freshly-pinged version is the one to keep.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then exit 0; fi
            echo "Push rejected (attempt $attempt) - rebasing onto origin/$branch."
            git fetch --unshallow origin "$branch" 2>/dev/null || git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git checkout --ours -- state/cloud-state.env || true
              git add state/cloud-state.env
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
          done
          echo "::error::Could not push the updated state after 3 attempts."
          exit 1
